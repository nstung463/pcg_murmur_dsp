[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcg-murmur-dsp"
version = "0.1.0"
description = "Reproducible DSP and ML experiments for robust phonocardiogram murmur detection"
requires-python = ">=3.11,<3.13"
dependencies = [
  "joblib>=1.4",
  "librosa>=0.10.2",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "PyWavelets>=1.6",
  "PyYAML>=6.0",
  "requests>=2.31",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "seaborn>=0.13",
  "soundfile>=0.12",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ui = ["streamlit>=1.40", "torch>=2.0", "torchvision>=0.15"]

[project.scripts]
pcg-dsp = "pcg_dsp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
