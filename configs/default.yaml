data:
  root: data/circor-heart-sound/1.0.3/training_data
  label_column: murmur
  include_unknown: false
  max_patients: null
  # Public dataset mirrors can occasionally contain metadata without its WAV.
  # Skip those patients with a warning instead of aborting the whole experiment.
  skip_invalid_patients: true
split:
  seed: 42
  train_size: 0.70
  validation_size: 0.15
dsp:
  target_fs: 1000
  quantization_bits: 16
  filter: butterworth
  low_hz: 25
  high_hz: 400
  order: 4
  fir_taps: 129
  wavelet_denoise: false
  segment_seconds: 3.0
  segment_hop_seconds: 1.5
features:
  mode: hybrid
  n_mfcc: 13
  n_fft: 512
  hop_length: 128
noise:
  enabled: false
  snr_db: 10
  kind: white
model:
  kind: svm
  seed: 42
experiments:
  output_dir: artifacts/runs
